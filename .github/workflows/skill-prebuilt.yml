name: Published bootstrap downloads

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/skill-prebuilt.yml
      - scripts/ci/skill-prebuilt-smoke.mjs
      - scripts/skill/prebuilt-cores.mjs
      - scripts/skill/managed-runtime-bundles.mjs

permissions:
  contents: read

jobs:
  download:
    name: Public core and runtime download (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - name: Download and execute the pinned core without a build toolchain
        env:
          SKILL_PREBUILT_RESULT: ${{ runner.temp }}/skill-prebuilt.json
        run: node scripts/ci/skill-prebuilt-smoke.mjs
      - name: Retain observed download and replay evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-prebuilt-${{ matrix.os }}
          path: ${{ runner.temp }}/skill-prebuilt.json
          if-no-files-found: error
          retention-days: 14
