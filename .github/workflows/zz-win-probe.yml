# Throw-away lead probe. Lives only on the debug/win-probe branch; never merge.
name: win-probe
on:
  push:
    branches: [debug/win-probe]
permissions:
  contents: read
concurrency:
  group: win-probe
  cancel-in-progress: true
jobs:
  probe:
    name: Fixture runtime suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: xplat-probe
          cache-on-failure: true
      - name: Initialize the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/initialize-windows-toolchain.ps1
      - name: Skill bootstrap tests
        run: node --test tests/skill/*.test.mjs
      - name: Native bootstrap smoke (real prepare, cache reuse, run)
        if: ${{ !cancelled() }}
        run: node scripts/ci/skill-bootstrap-smoke.mjs
      - name: Probe targets
        if: ${{ !cancelled() }}
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --no-fail-fast --package ai-security-scanner --no-default-features --features cli --test cli_foreground_scan --test cli_runtime_prepare --test cli_cloudflare_audit --test cli_cloudflare_source_view --test cli_cloudflare_bundle
      - name: Probe targets again
        if: ${{ !cancelled() }}
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --no-fail-fast --package ai-security-scanner --no-default-features --features cli --test cli_foreground_scan --test cli_runtime_prepare --test cli_cloudflare_audit --test cli_cloudflare_source_view --test cli_cloudflare_bundle
  library:
    name: Library unit tests three times (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: xplat-probe
          cache-on-failure: true
      - name: Initialize the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/initialize-windows-toolchain.ps1
      - name: Library unit tests with the CLI feature
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --no-fail-fast --package ai-security-scanner --no-default-features --features cli --lib
      - name: Library unit tests again
        if: ${{ !cancelled() }}
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --no-fail-fast --package ai-security-scanner --no-default-features --features cli --lib
      - name: Library unit tests a third time
        if: ${{ !cancelled() }}
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --no-fail-fast --package ai-security-scanner --no-default-features --features cli --lib
  warnings:
    name: Windows compile with warnings denied
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action commit, 2026-08-21
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
          shared-key: win-probe-warnings
          cache-on-failure: true
      - name: Initialize the native Windows compiler environment
        shell: pwsh
        run: ./scripts/ci/initialize-windows-toolchain.ps1
      - name: Every target with the CLI feature
        run: cargo check --locked --package ai-security-scanner --no-default-features --features cli --all-targets
