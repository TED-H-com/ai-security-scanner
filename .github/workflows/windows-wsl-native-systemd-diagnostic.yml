name: Diagnose the native-systemd Podman client backport

on:
  push:
    branches: [fix/windows-wsl-native-systemd]
    paths:
      - .github/workflows/windows-wsl-native-systemd-diagnostic.yml
      - scripts/diagnostics/**
      - runtime/podman-wsl-native-systemd.patch

permissions:
  contents: read
  actions: read

jobs:
  installed-runtime:
    name: Patched native-systemd client with Windows ${{ matrix.installer }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Build the source-pinned native-systemd Podman client
        shell: pwsh
        run: scripts/diagnostics/build-native-podman.ps1 -WorkDirectory "$env:RUNNER_TEMP/native-podman-build"
      - name: Download the existing immutable Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 12006110488
          run-id: 38797977442
          github-token: ${{ github.token }}
          path: release-input
          digest-mismatch: error
      - name: Exercise the patched client with the installed CLI and normal runtime cleanup
        shell: pwsh
        env:
          INSTALLER_TYPE: ${{ matrix.installer }}
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content scripts/release/qualify-windows.ps1 -Raw
          $needle = '  $runtimeManifest = $runtimeManifests[0].FullName'
          if ($script.Split($needle).Count -ne 2) { throw "Qualification insertion point changed." }
          $insertion = @'
            $nativeBundle = Join-Path $env:RUNNER_TEMP "native-test/managed-runtime"
            & node scripts/diagnostics/prepare-native-bundle.mjs (Split-Path $runtimeManifest) (Join-Path $env:RUNNER_TEMP "native-podman-build/podman.exe") $nativeBundle
            if ($LASTEXITCODE -ne 0) { throw "Diagnostic bundle preparation failed." }
            $env:AI_SECURITY_SCANNER_MANAGED_RUNTIME_BUNDLE = $nativeBundle
            $runtimeManifest = Join-Path $nativeBundle "manifest.json"
          '@
          $script = $script.Replace($needle, $needle + "`n" + $insertion)
          # This probe exercises the client through the explicit maintainer CLI
          # override. The installed desktop keeps its original compiled anchor.
          $desktopPattern = '(?s)  # The desktop uses this exact default LocalAppData root\..*?  \$desktopProcess\.WaitForExit\(\)'
          if ([regex]::Matches($script, $desktopPattern).Count -ne 1) { throw "Desktop block changed." }
          $script = [regex]::Replace($script, $desktopPattern, '  # Desktop startup is outside this diagnostic client probe.')
          $script = $script.Replace('desktopStartup = [ordered]@{ outcome = "passed"; observationSeconds = 12;', 'desktopStartup = [ordered]@{ outcome = "not-tested"; observationSeconds = 0;')
          $script | Set-Content -Encoding utf8NoBOM scripts/release/qualify-windows-native-diagnostic.ps1
          & scripts/release/qualify-windows-native-diagnostic.ps1 -ArtifactDirectory release-input -WorkDirectory "$env:RUNNER_TEMP/native-systemd-observation" -InstallerType $env:INSTALLER_TYPE
      - name: Preserve bounded qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-systemd-${{ matrix.installer }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-systemd-observation
          if-no-files-found: warn
          retention-days: 7
