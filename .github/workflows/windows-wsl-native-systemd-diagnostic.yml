name: Diagnose native systemd in the managed Windows WSL guest

on:
  push:
    branches: [fix/windows-wsl-native-systemd]
    paths:
      - .github/workflows/windows-wsl-native-systemd-diagnostic.yml
      - scripts/diagnostics/wsl-native-systemd.sh

permissions:
  contents: read
  actions: read

jobs:
  installed-runtime:
    name: Native systemd with frozen Windows ${{ matrix.installer }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
      - name: Download the existing immutable Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 12006110488
          run-id: 38797977442
          github-token: ${{ github.token }}
          path: release-input
          digest-mismatch: error
      - name: Exercise native systemd with the installed candidate and normal cleanup
        shell: pwsh
        env:
          INSTALLER_TYPE: ${{ matrix.installer }}
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content scripts/release/qualify-windows.ps1 -Raw
          $needle = '  $runningStatus = Invoke-Managed "running-status" @("status")'
          if ($script.Split($needle).Count -ne 2) { throw "Qualification insertion point changed." }
          $insertion = @'
            $distribution = "podman-$managedMachineName"
            & $wsl --version
            $guestScript = (Get-Content scripts/diagnostics/wsl-native-systemd.sh -Raw).Replace("`r`n", "`n")
            $guestScript | & $wsl --distribution $distribution --user root --exec /bin/bash -s
            if ($LASTEXITCODE -ne 0) { throw "Guest configuration failed." }
            $nativeStop = Invoke-Managed "native-transition-stop" @("stop")
            $nativeStart = Invoke-Managed "native-transition-start" @("start")
            & $wsl --distribution $distribution --user root --exec /bin/sh -c 'cat /proc/1/comm; cat /proc/self/cgroup; cat /sys/fs/cgroup/cgroup.controllers'
            if ($LASTEXITCODE -ne 0) { throw "Native systemd diagnostics failed." }
          '@
          $script.Replace($needle, $insertion + "`n" + $needle) | Set-Content -Encoding utf8NoBOM scripts/release/qualify-windows-native-diagnostic.ps1
          & scripts/release/qualify-windows-native-diagnostic.ps1 -ArtifactDirectory release-input -WorkDirectory "$env:RUNNER_TEMP/native-systemd-observation" -InstallerType $env:INSTALLER_TYPE
      - name: Preserve bounded qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-systemd-${{ matrix.installer }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-systemd-observation
          if-no-files-found: warn
          retention-days: 7
