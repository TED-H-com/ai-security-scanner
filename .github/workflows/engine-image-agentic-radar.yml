name: Publish managed Agentic Radar engine image

on:
  push:
    branches:
      - main
    paths:
      - engines/images/agentic-radar/**
      - '!engines/images/agentic-radar/plan.json'
      - docs/research/patches/agentic-radar-0.14.1-machine-json.patch
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: managed-agentic-radar-engine-image-0.14.1-1
  cancel-in-progress: false

env:
  ENGINE: agentic-radar
  IMAGE: ghcr.io/ted-h-com/ai-security-scanner-engine-agentic-radar
  IMAGE_TAG: 0.14.1-1

jobs:
  publish:
    name: Publish Agentic Radar for amd64 + arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the dedicated non-shell launcher
        run: |
          docker run --rm --network none \
            -v "${PWD}/engines/images/agentic-radar/launcher:/src:ro" \
            -w /src \
            golang:1.26.3-alpine@sha256:91eda9776261207ea25fd06b5b7fed8d397dd2c0a283e77f2ab6e91bfa71079d \
            sh -ceu 'test -z "$(gofmt -d main.go main_test.go)"; go test ./...'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard the immutable managed version tag
        id: guard
        uses: ./.github/actions/engine-image-evidence/publication-guard
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the immutable multi-platform image
        id: build
        if: steps.guard.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engines/images/agentic-radar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.candidate_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=managed-engine-agentic-radar
          cache-to: type=gha,mode=max,scope=managed-engine-agentic-radar

      - name: Publish anonymous pull access
        if: steps.guard.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_repository="${IMAGE#ghcr.io/}"
          package="${registry_repository#*/}"
          gh api --method PATCH "/orgs/TED-H-com/packages/container/${package}" -f visibility=public

      - name: Verify platforms, dependency boundary, and managed finding
        id: verify
        env:
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          raw_manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${raw_manifest}")"
          arm64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${raw_manifest}")"
          test "${amd64_digest#sha256:}" != "${amd64_digest}"
          test "${arm64_digest#sha256:}" != "${arm64_digest}"

          docker run --platform linux/amd64 --rm \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /usr/local/bin/python3 \
            "${IMAGE}@${DIGEST}" \
            -c 'import importlib.util, agentic_radar; assert agentic_radar.__version__ == "0.14.1"; assert all(importlib.util.find_spec(name) is None for name in ("agents", "crewai", "langgraph", "autogen", "transformers", "torch", "pytest", "poetry"))'

          output="$(mktemp -d)"
          docker run --platform linux/amd64 --rm \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m \
            --mount "type=bind,src=${PWD}/engines/images/agentic-radar/testdata/workspace,dst=/workspace,readonly" \
            --mount "type=bind,src=${output},dst=/output" \
            --mount "type=bind,src=${PWD}/engines/images/agentic-radar/testdata/scope.json,dst=/run/ai-security-scanner/scope.json,readonly" \
            "${IMAGE}@${DIGEST}" \
            --engine agentic-radar --workspace /workspace --output /output

          report="${output}/agentic-radar.json"
          test -f "${report}"
          test "$(find "${output}" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(stat -c '%a' "${report}")" = 600
          jq -e '
            .schema_version == "1" and
            .scanner_version == "0.14.1" and
            .framework == "langgraph" and
            .status == "workflow_found" and
            .complete == true and
            .warnings == [] and
            (.graph.nodes | length) == 3 and
            (.graph.tools | length) == 1 and
            ([.graph.nodes[], .graph.tools[], .graph.agents[]] | all(.vulnerabilities == []))
          ' "${report}" >/dev/null

          smoke_evidence="package-evidence/agentic-radar-managed-smoke"
          mkdir -p "${smoke_evidence}"
          cp "${report}" "${smoke_evidence}/agentic-radar.json"
          (
            cd "${smoke_evidence}"
            sha256sum agentic-radar.json > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          evidence_sha256="sha256:$(sha256sum "${smoke_evidence}/SHA256SUMS.txt" | cut -d ' ' -f 1)"
          {
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
            echo "evidence_sha256=${evidence_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record the published index and platform digests
        env:
          AMD64_DIGEST: ${{ steps.verify.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.verify.outputs.arm64_digest }}
          DIGEST: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          EVIDENCE_SHA256: ${{ steps.verify.outputs.evidence_sha256 }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p package-evidence
          jq -n \
            --arg engine "${ENGINE}" \
            --arg image "${IMAGE}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${DIGEST}" \
            --arg amd64Digest "${AMD64_DIGEST}" \
            --arg arm64Digest "${ARM64_DIGEST}" \
            --arg evidenceSha256 "${EVIDENCE_SHA256}" \
            --arg revision "${REVISION}" \
            '{schemaVersion: 1, engine: $engine, image: $image, tag: $tag, digest: $digest, platformDigests: {"linux/amd64": $amd64Digest, "linux/arm64": $arm64Digest}, sourceRevision: $revision, anonymousPullVerified: true, managedSmokeEvidenceSha256: $evidenceSha256}' \
            > package-evidence/agentic-radar-image-manifest.json
          printf 'Published and anonymously verified `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve signed publication and per-platform SBOM evidence
        uses: ./.github/actions/engine-image-evidence
        with:
          mode: ${{ steps.guard.outputs.mode }}
          engine: ${{ env.ENGINE }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the signed candidate without overwriting a version
        id: promote
        uses: ./.github/actions/engine-image-evidence/promote
        with:
          mode: ${{ steps.guard.outputs.mode }}
          image: ${{ env.IMAGE }}
          tag: ${{ env.IMAGE_TAG }}
          digest: ${{ steps.guard.outputs.digest || steps.build.outputs.digest }}
          source-revision: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify anonymous immutable version access
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          docker logout ghcr.io
          resolved="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | jq -er 'select(test("^sha256:[0-9a-f]{64}$"))')"
          test "${resolved}" = "${DIGEST}"

      - name: Seal the downloadable evidence inventory
        run: |
          set -o pipefail
          (
            cd package-evidence
            find . -type f ! -path './SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload publication and signed supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-radar-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-evidence
          if-no-files-found: error
          retention-days: 90
